name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    name: fast lane (SQLite, hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=9.0.2" "pytest-asyncio>=1.3.0" "pytest-cov>=7.0.0" "httpx>=0.28.1"
      # No secrets are provided to this job on purpose: tests/isolation.py
      # installs placeholder credentials and blocks outbound sockets, so a test
      # that reaches a real provider fails here instead of in production.
      - name: Run fast lane
        run: python -m pytest -p no:cacheprovider

  integration:
    name: integration lane (PostgreSQL + pgvector, Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: studentscompass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=9.0.2" "pytest-asyncio>=1.3.0" "pytest-cov>=7.0.0" "httpx>=0.28.1"
      # Both URLs are loopback: tests/isolation.assert_local_url refuses to aim
      # this lane at anything else, so a stale variable cannot hit a real
      # deployment.
      - name: Run integration lane
        env:
          TEST_DATABASE_URL_PG: postgresql+asyncpg://testuser:testpw@127.0.0.1:5432/studentscompass_test
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: python -m pytest -p no:cacheprovider tests/integration

  browser:
    name: browser lane (Chromium, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=9.0.2" "pytest-asyncio>=1.3.0" "httpx>=0.28.1" "playwright>=1.62.0"
          python -m playwright install --with-deps chromium
      # Every request the page makes is fulfilled by the test's own route
      # handler, so the browser reaches no external host.
      - name: Run browser lane
        run: python -m pytest -p no:cacheprovider -m browser

  baseline:
    name: baseline lane (TASK-035, OpenAPI + fixtures + capturas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=9.0.2" "pytest-asyncio>=1.3.0" "httpx>=0.28.1" "playwright>=1.62.0"
          python -m playwright install --with-deps chromium
      # Sin secretos, igual que la lane rápida: la captura corre sobre una
      # SQLite desechable con datos sintéticos y el aislamiento bloquea la
      # salida, así que ningún dato real puede acabar en el artefacto. El paso
      # falla si la revisión de secretos/PII encuentra algo.
      - name: Capturar la baseline
        run: python scripts/capture_baseline.py
      # Los PNG no se versionan (docs/refactor/baseline/README.md): ~18 MB por
      # captura. Se publican aquí y se comparan descargando dos ejecuciones.
      - name: Publicar las capturas
        uses: actions/upload-artifact@v4
        with:
          name: baseline-screens
          path: docs/refactor/baseline/screens/
          retention-days: 30
