# Nginx configuration for the frontend service.
#
# This file is a template: the official entrypoint runs `envsubst` over
# /etc/nginx/templates/*.template at container start and writes the result into
# /etc/nginx/conf.d/. `NGINX_ENVSUBST_FILTER=API_ORIGIN` (set in the Dockerfile)
# restricts substitution to that one variable, so nginx's own runtime variables
# — $uri, $host, $proxy_add_x_forwarded_for — survive intact.
#
# API_ORIGIN is injected here and never reaches the bundle (plan 08 §11). The
# browser only ever sees relative paths, which is what makes cookies
# first-party and removes CORS from the design (§1, §3).
#
# API_DNS_RESOLVER is the second injected value; both share the `API_` prefix
# the envsubst filter matches. It exists because of a failure reproduced while
# building this file: with a literal `proxy_pass http://api:8080`, nginx
# resolves the name once at startup and caches the address for the life of the
# process. Recreating the API container — a redeploy, or a `docker compose up`
# that replaces it — left this proxy answering 502 against an address nobody
# was listening on any more. A managed platform re-addresses its frontends the
# same way, so the fix belongs here and not in a runbook: a `resolver` plus a
# variable in `proxy_pass` forces the name to be resolved per request.
#   - docker compose: 127.0.0.11, the embedded DNS server.
#   - Cloud Run: the nameserver in the container's /etc/resolv.conf
#     (169.254.169.254). TASK-056 sets it with the service.

# X-Forwarded-Proto: behind Cloud Run this container is already proxied, so the
# platform's header is the truth; on a bare `docker compose up` there is none
# and $scheme is. Deciding it once here beats each location guessing.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# --- Legacy asset map (cutover, TASK-058) ---------------------------------
#
# Until the cutover, `/static/*` was served by FastAPI's StaticFiles mount and
# had real traffic: 179 responses with 200 in the window measured in
# docs/refactor/10_CUTOVER_RUNBOOK.md §8, the logo among them (it is the
# historical og:image and is hot-linked from outside).
#
# The moment the domain points here, nothing proxies `/static/` any more, and
# without this map the SPA history fallback would answer a PNG request with
# `200 text/html`. That is worse than a 404: no cache and no client detects it
# as an error.
#
# The map is written out file by file on purpose rather than rewriting the
# whole prefix. Only four of the six legacy images exist in the bundle
# (`frontend/public/images`), so a blanket `/static/images/(.*) -> /images/$1`
# would send `favicon.ico` and `icono.ico` straight back into the same silent
# fallback it is meant to remove. Anything absent from this map is Gone, which
# is what §9 of the runbook decided for the legacy CSS and JS.
# --- Routes the SPA actually has (cutover, TASK-058) -----------------------
#
# The history fallback at the bottom of this file answers every extensionless
# path with the entry document. That is what makes a deep link work on a hard
# refresh, and it is also why, without this map, `/no-existe` answered **200**:
# nginx has no idea which paths the router knows, so it treated a typo like a
# screen. React then rendered the not-found screen inside a 200 response — a
# soft 404, which tells a crawler the page exists and is that.
#
# The monolith being replaced returns a real 404 here (verified against the
# live domain: 404, 22 bytes), so shipping the soft one would have been a
# regression introduced by the cutover itself.
#
# Written out route by route rather than as a loose pattern: the point is that
# nginx refuses anything the router does not have, and a pattern broad enough
# to be convenient is broad enough to let the typos back in. `:params` become
# `[^/]+`, matching one segment, exactly as the router matches them.
#
# `src/app/cutoverRouting.test.ts` asserts that every route in the table is
# matched here. Adding a screen to the router without adding it here fails that
# test rather than 404-ing a real page in production.
map $uri $spa_route_known {
    default                         0;

    ~^/$                            1;
    ~^/about$                       1;
    ~^/__smoke$                     1;
    ~^/login$                       1;
    ~^/register$                    1;
    ~^/admin$                       1;
    ~^/admin/login$                 1;
    ~^/dashboard$                   1;
    ~^/profile$                     1;
    ~^/questionnaire$               1;
    ~^/resources$                   1;
    ~^/resources/[^/]+$             1;
    ~^/roadmaps$                    1;
    ~^/roadmaps/[^/]+$              1;
    ~^/jobs$                        1;
    ~^/jobs/applications$           1;
    ~^/career-lab$                  1;
    ~^/community$                   1;
    ~^/community/[^/]+$             1;
    ~^/messages$                    1;
    ~^/messages/[^/]+$              1;
    ~^/company$                     1;
    ~^/company/postings$            1;
    ~^/company/applicants$          1;
    ~^/company/recruiters$          1;
}

map $uri $legacy_asset_target {
    default                               "";
    /static/images/Logo_Ready_to_Use.png  /images/Logo_Ready_to_Use.png;
    /static/images/goal.svg               /images/goal.svg;
    /static/images/resources.svg          /images/resources.svg;
    /static/images/roadmap.svg            /images/roadmap.svg;
    # The bundle keeps the icon at the document root, not under /images.
    /static/images/favicon.ico            /favicon.ico;
}

server {
    # Cloud Run's default port and the port nginx-unprivileged listens on. The
    # deployment must pass --port=8080 rather than expecting $PORT to be read:
    # the envsubst filter above deliberately does not substitute it.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bundle is public, but the pages it renders are not: nothing here may
    # be cached by a shared proxy on behalf of a signed-in user.
    #
    # Bug Fix (TASK-058 pre-flight): these are repeated in `/assets/` and in
    # `= /index.html` below. `add_header` is inherited only when the lower
    # level declares none of its own, so the two locations that set
    # `Cache-Control` were silently dropping all three of these. The entry
    # document losing `X-Frame-Options: DENY` is the one that matters, and the
    # cutover is what turns this file into the thing serving every real user.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Every `return 301` below sends a path, not a URL. Left to itself nginx
    # would expand those into absolute URLs built from $host and the port it is
    # actually listening on — which here is 8080, not 443. Behind Cloud Run
    # that produces `https://studentscompass.ca:8080/profile`, a Location
    # header pointing at a port the platform does not publish. Caught by the
    # local run of the redirects in the TASK-058 pre-flight; relative Location
    # headers have been legal since RFC 7231 and are what the browser wants.
    absolute_redirect off;

    resolver ${API_DNS_RESOLVER} valid=30s ipv6=off;

    # --- Shared upstream settings -----------------------------------------
    #
    # Hoisted to the server level because two locations proxy to the API now:
    # the prefix match below and the exact match for `/api/v1/auth/register`.
    # Duplicating eight directives between them is how the two drift apart.
    # Every one of these is inherited by a location that declares none of its
    # own, which is why neither proxying location sets any header itself.

    # Uploads are bounded by the backend (MAX_POST_UPLOAD_BYTES = 10 MB plus
    # multipart overhead). Nginx must not be the tighter of the two, or a CV
    # upload would fail with a 413 that never reaches FastAPI and therefore
    # never produces the API's own error body.
    client_max_body_size 12m;

    # A CV analysis request is slow by nature; the default 60s read timeout
    # would cut it before the API answered.
    proxy_read_timeout 120s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    # Host stays $proxy_host on purpose: a managed platform routes on it, and
    # the original host travels in X-Forwarded-Host. The app resolves the
    # client IP through TRUSTED_PROXY_IPS, not through Host
    # (docs/ingress_and_client_ip.md).
    proxy_ssl_server_name on;

    # The variable is what defers resolution to request time; $request_uri is
    # then required to pass the original URI through untouched.
    set $api_origin ${API_ORIGIN};

    # --- Legacy URL redirects (cutover, TASK-058) -------------------------
    #
    # Seven screens kept their behaviour but changed their address when the
    # React router replaced the Jinja views. An exact-match location beats both
    # the regex below and the SPA fallback, so these are decided here rather
    # than inside the bundle: a 301 served by the proxy is one owner, costs no
    # SPA boot, and a crawler reads it without executing JavaScript.
    #
    # They are 301 and not 404 because each one has a successor. `/static/*`
    # (further down) is 410 for the opposite reason. See §9 of the runbook —
    # the choice is per route, never a default.
    location = /user-profile       { return 301 /profile; }
    location = /company-dashboard  { return 301 /company; }
    location = /company-candidates { return 301 /company/applicants; }
    location = /company-team       { return 301 /company/recruiters; }
    location = /home               { return 301 /; }
    location = /roadmap            { return 301 /roadmaps; }

    # The eighth, and the only Jinja screen that survives the cutover.
    #
    # `GET /api/v1/auth/register` is a Jinja view mounted under the API prefix
    # (backend/app/views/views.py:72); it shares its path with the
    # fastapi-users `POST` that actually registers a user. Because it hangs off
    # `/api/v1`, the prefix match below proxies it, so after the cutover it
    # would still hand a user the old registration page — 11,513 bytes of
    # legacy HTML — from inside the new frontend.
    #
    # Only the read side is redirected. The POST is the live registration
    # endpoint the SPA calls and must reach the API untouched. `if` is doing
    # one of its two documented-safe jobs here (`return`), not branching config.
    location = /api/v1/auth/register {
        if ($request_method ~ ^(GET|HEAD)$) {
            return 301 /register;
        }
        proxy_pass $api_origin$request_uri;
    }

    # --- Retired static mount ---------------------------------------------
    #
    # `^~` so this wins as the longest matching prefix and the regex below is
    # never consulted for `/static/`.
    location ^~ /static/ {
        if ($legacy_asset_target) {
            return 301 $legacy_asset_target;
        }
        return 410;
    }

    # The targets of that map. `=404` rather than falling through to the SPA:
    # an image added to the map but missing from the bundle has to fail as a
    # missing image, not as a 200 of HTML.
    location ^~ /images/ {
        try_files $uri =404;
    }

    # --- API and operational endpoints ------------------------------------
    #
    # These prefixes are the whole contract with the backend, and they are the
    # same Vite proxies in dev (vite.config.ts). Everything else falls through
    # to the SPA below.
    #
    # `robots.txt` and `sitemap.xml` used to be forwarded from here. They are
    # served from the bundle now (runbook §7, option A) — see the exact matches
    # further down. The retire matrix entry that reads "frontend Nginx" is
    # finally true, and TASK-059 can drop them from `app/app.py` without
    # breaking anything.
    #
    # `/auth/jwt/` is here on purpose, and it is temporary (runbook §4, B4).
    # It is the legacy login the Jinja pages call, and after the cutover no
    # served page calls it any more — which is exactly the problem. Left out of
    # this list it would answer 405 from the SPA fallback, and its request would
    # never reach FastAPI, so the traffic log for it would read zero *by
    # construction*. TASK-059 requires zero-traffic evidence before retiring it,
    # and evidence that cannot distinguish "nobody calls this" from "nobody can
    # call this" is not evidence (B6). Forwarding it during the observation
    # window is what makes the measurement mean something, and it keeps a
    # session alive for anyone who had the old login page open at the moment of
    # the cutover. It comes out of this list in TASK-059, together with the
    # mount in `app/app.py`, once the window has measured it.
    location ~ ^/(api/|auth/jwt/|health(?:z)?$|ready(?:z)?$) {
        proxy_pass $api_origin$request_uri;
    }

    # --- Real 404s -------------------------------------------------------
    #
    # A path ending in a file extension is an asset request. It is never a
    # client-side route, so the SPA fallback has no business answering it and
    # the honest answer is 404.
    #
    # This is the half of the not-found problem that can be solved here. The
    # other half — an unknown path with no extension, like `/dashbaord` — nginx
    # cannot judge without being told every route the router knows, and a
    # second copy of the route table in this file would drift from the real one
    # in silence. Those reach the SPA, which renders NotFoundPage with
    # `noindex`. Runbook §9 records the trade-off.
    #
    # What it buys: the scanner traffic that was 39% of all inbound requests
    # probes for files — `/wp-admin/install.php`, `/.env`, `/index.php` — and
    # goes back to being a 404 instead of a 200 of HTML. Without this, the
    # cheapest signal there is for separating real traffic from noise
    # disappears on the day of the cutover, which is precisely the day the
    # observation window starts needing it.
    #
    # Declared after the proxy regex above on purpose: regexes are evaluated in
    # order, so /robots.txt and /sitemap.xml still reach the API. /assets/,
    # /images/ and /static/ are `^~` prefixes and /favicon.ico is an exact
    # match, so all four beat this regex outright.
    # Quoted: nginx parses an unquoted `{` as the start of a block, so the
    # `{1,8}` repetition has to be inside a string or the config does not load.
    # `.*` and not `.+`: with `.+` there has to be a character before the dot,
    # which lets a dotfile through — `/.env` was answering 200 with the SPA,
    # and `/.env` is the second most probed path in the logs.
    location ~ "^/.*\.[A-Za-z0-9]{1,8}$" {
        return 404;
    }

    # Exact match, so it wins over the extension rule above. `=404` rather than
    # the SPA fallback for the same reason as /images/: a missing icon has to
    # fail as a missing icon.
    location = /favicon.ico {
        try_files $uri =404;
    }

    # --- SEO files, served not forwarded (runbook §7) ----------------------
    #
    # Exact matches, because both end in an extension and would otherwise be
    # caught by the 404 rule above. `=404` rather than the SPA fallback: a
    # sitemap that answers with HTML is worse than one that is missing, since a
    # crawler reports the former as a malformed sitemap and the latter as
    # nothing at all.
    location = /robots.txt {
        try_files $uri =404;
    }

    location = /sitemap.xml {
        # nginx's mime.types maps .xml to text/xml; FastAPI was sending
        # application/xml. Both are legal for a sitemap, but the migration's
        # rule is that behaviour does not change unless a change is the point,
        # and a content type is the kind of difference nobody notices until a
        # crawler does.
        types { }
        default_type application/xml;
        try_files $uri =404;
    }

    # --- Static bundle -----------------------------------------------------

    # Hashed filenames, so the content behind a URL never changes (plan 08 §7).
    #
    # `^~` and not a plain prefix: a plain prefix location loses to any regex
    # that also matches, and the extension rule above is a regex that matches
    # every hashed filename in here. Without the `^~` the bundle would 404
    # itself.
    location ^~ /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The entry document must not be cached: it is what points at the current
    # bundle hash, and a stale copy pins a browser to a deleted deploy.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # Deep links are client-side routes. This fallback is why the API prefixes
    # above must be declared: without them, /api/whatever would answer 200 with
    # the SPA's HTML instead of the API's 404.
    #
    # The named location runs only after `try_files` has failed to find a real
    # file, so an existing file is still served without consulting the route
    # map. Deciding before that check would let the map veto a file that is
    # actually there.
    location / {
        try_files $uri $uri/ @spa;
    }

    # A path the router does not have is a 404, and it has to say so in the
    # status line and not only on the screen.
    #
    # `error_page` is declared inside this location on purpose. At server level
    # it would also catch the extension rule's 404s, and answering the 18.068
    # scanner probes of runbook §8 with the 2.5 KB entry document instead of
    # nginx's own page would be both wasteful and confusing — a probe for
    # `/.env` would come back looking like the application.
    #
    # `return 404` here reaches the client as 404 carrying the entry document,
    # because error_page without `=` keeps the original status. That is the
    # combination the cutover needs: the crawler reads 404, the person gets the
    # not-found screen the router renders.
    location @spa {
        error_page 404 /index.html;

        if ($spa_route_known = 0) {
            return 404;
        }

        try_files /index.html =404;
    }
}
