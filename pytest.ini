[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# The default run is the fast lane: hermetic, no coverage artifacts written
# into the repo. Coverage is opt-in so a plain `pytest` stays reproducible:
#   .venv/bin/python -m pytest --cov=app --cov-report=term-missing
addopts = -q

markers =
    integration: requires a disposable external service; skipped unless its lane URL is set
    postgres: requires the PostgreSQL + pgvector lane (TEST_DATABASE_URL_PG)
    redis: requires the Redis lane (TEST_REDIS_URL)
    contract: characterization test pinning current behavior before a refactor
    browser: drives real static scripts in a headless browser; skipped without Playwright/Chromium

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
