[project]
name = "studentscompass"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.1",
    "fastapi>=0.128.0",
    "fastapi-users[sqlalchemy]>=14.0.2",
    "imagekitio>=5.0.0",
    "jinja2>=3.1.6",
    "pillow>=12.1.0",
    "python-dotenv>=1.2.1",
    "uvicorn[standard]>=0.39.0",
    "beautifulsoup4>=4.12.3",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "google-genai>=1.59.0",
    "pymupdf>=1.26.7",
    "boto3>=1.35.0",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.11",
    "sentence-transformers>=3.3.1",
    "ortools>=9.15.6755",
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    # Bounded browser tests for the DOM/link sinks. The browser itself is a
    # separate download: `python -m playwright install chromium`. Tests marked
    # `browser` skip cleanly when either is missing.
    "playwright>=1.62.0",
    # Linter de la lane de backend (TASK-039). Vive en el grupo dev para que
    # `uv run ruff` local y la lane de CI usen la misma versión resuelta por el
    # lock, en vez de que cada uno instale la última publicada ese día.
    "ruff>=0.14.6",
]

# --- Dev tooling -----------------------------------------------------------
# Coverage is opt-in (see pytest.ini). Scope is pinned here so the numbers mean
# the same thing in CI and locally.
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/__pycache__/*",
    "app/static/*",
    "app/templates/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

# --- Lint (TASK-039) -------------------------------------------------------
# Plan 08 §10 pide Ruff en la lane de backend. Se activa el conjunto por defecto
# (E4 imports, E7 sentencias, E9 errores de sintaxis, F pyflakes): son fallos
# reales, no estilo opinado.
#
# `ruff format` NO se ejecuta en CI y no se configura aquí. Formatear el árbol
# entero es un diff que toca cada fichero de `app/` y no cabe en una tarea de
# infraestructura que declara «sin cambios de comportamiento en la aplicación».
# Adoptarlo es una decisión con su propia ficha.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# El conjunto por defecto, explícito: que se lea en el fichero qué se exige.
select = ["E4", "E7", "E9", "F"]

# Una sola clase de excepción vive en esta tabla, y es permanente: E402 en los
# tres sitios donde hay código que debe correr antes de los imports.
#
# E402 en `app/app.py` y `tests/conftest.py` es **permanente y justificado**: en
# ambos ficheros hay código que debe correr antes de los imports, que es
# exactamente lo que E402 prohíbe. `app/app.py` llama `load_dotenv()` antes de
# importar `app.db`, que construye el engine en tiempo de import;
# `tests/conftest.py` llama `apply_isolation()` antes de importar nada de `app`,
# y eso es lo que impide que la suite lea `.env` o salga a la red.
#
# La deuda de F401, F841 y E741 que TASK-039 inventarió aquí fichero a fichero
# **ya no existe**: TASK-060 la retiró. Los pocos imports que se conservan sin
# usar llevan `# noqa: F401` con su razón en la línea, que es donde se lee — casi
# todos son registro de mappers de SQLAlchemy, donde borrar el import rompe la
# resolución de una relación en runtime sin que ningún test unitario tenga por
# qué notarlo.
#
# **No se añaden ficheros nuevos a esta lista.** Una exención por fichero también
# exime al código que se escriba mañana; si algo necesita una excepción, va en su
# línea.
[tool.ruff.lint.per-file-ignores]
# E402 en `scripts/` es la tercera excepción de la misma clase, añadida por
# TASK-029: cada script arranca insertando la raíz del proyecto en `sys.path`
# para poder importar `app`, y ese prólogo tiene que ejecutarse antes de los
# imports, exactamente igual que en los dos ficheros de arriba. **No es deuda de
# TASK-060.** Los scripts entraron en el radar de Ruff al dejar de estar
# ignorados en `.gitignore`, y los 23 hallazgos que sí eran deuda —imports
# muertos y f-strings sin interpolación— se corrigieron allí en vez de exentarse.
"app/app.py" = ["E402"]
"scripts/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]
